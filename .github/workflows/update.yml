name: Update cask

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Update from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-cask.py
      - name: Commit the update
        run: |
          if git diff --quiet -- Casks/spatie-bloom.rb; then
            exit 0
          fi
          ruby -c Casks/spatie-bloom.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/spatie-bloom.rb
          git commit -m "Update Bloom cask"
          git push
